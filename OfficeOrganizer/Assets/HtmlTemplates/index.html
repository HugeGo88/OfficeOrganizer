<!DOCTYPE html>
<html>

<head>
    <style type="text/css">
        :root {
            --cvjmRed: #ED1443;
            --cvjmRedMark: #ED1443A0
        }

        body {
            zoom: 1;
            font-family: 'Source Sans Pro', sans-serif;
        }

        .page-header, .page-header-space {
            height: 150px;
            width: 100%;
        }

        .page-footer, .page-footer-space {
            height: 150px;
            width: 100%;
        }

        .page-footer {
            position: fixed;
            bottom: 0mm;
            left: 0mm;
            right: 0;
            font-size: 7pt;
            line-height: 7pt;
        }

        .page-header {
            position: fixed;
            top: 11.7mm;
            margin: 0;
            width: 100%;
            font-size: 7pt;
            line-height: 7pt;
        }

        .page {
            page-break-after: always;
            width: 100%;
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 11pt;
            line-height: 14pt;
        }

        .footer-tabel {
            margin-left: 25mm;
            text-align: left;
            margin-bottom: 11.7mm;
        }

        @media print {
            thead {
                display: table-header-group;
            }

            tfoot {
                display: table-footer-group;
            }

            body {
                margin: 0%;
                zoom: 1;
            }

            .pagebreak {
                clear: both;
                page-break-after: always;
            }
        }

        .grid-container {
            display: grid;
            grid-template-columns: auto auto;
        }

        a {
            color: var(--cvjmRed);
            text-decoration: none;
        }

        h1 {
            font-weight: lighter;
            font-size: 20pt;
            line-height: 25pt;
        }

        h2 {
            font-weight: bold;
            font-size: 16pt;
            line-height: 20pt;
            color: var(--cvjmRed);
        }

        h3 {
            font-weight: bold;
            font-size: 13pt;
            line-height: 1.25;
        }

        h4, h5, h6 {
            font-weight: bold;
            font-size: 11pt;
            line-height: 1.25;
        }

        blockquote {
            position: relative;
            padding: 25px;
            font-size: 13pt;
            font-weight: bold;
            width: auto;
            display: table;
            quotes: "\201C""\201D""\2018""\2019"
        }

        blockquote:before {
            position: absolute;
            color: var(--cvjmRed);
            content: open-quote;
            font-size: 5em;
            top: 25px;
            right: -20px;
        }

        blockquote:after {
            position: absolute;
            color: var(--cvjmRed);
            content: close-quote;
            font-size: 5em;
            bottom: 0px;
            left: -20px;
        }

        blockquote p {
            display: inline;
        }

        cite {
            font-weight: lighter;
        }

        mark {
            background-color: var(--cvjmRedMark);
        }

        code {
            font-size: 9pt;
        }

        ul {
            list-style-type: square !important;
        }

        .section-1 table {
            width: 100%;
            border-collapse: collapse;
        }

        .section-1 tr:nth-child(even) {
            background: #CCC
        }

        .section-1 tr:nth-child(odd) {
            background: #FFF
        }
    </style>
    <style id=page_style>
        @page {
            size: A4;
            margin: 0cm;

            @bottom-center{
                content: counter(page) " / " counter(pages);
                font-size: 10pt;
                color: black;
            }
        }
    </style>
    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,200,900italic,900,700italic,700,600italic,600,400italic,300italic,300,200italic'
          rel='stylesheet' type='text/css'>
</head>
